---
- name: Check whether Composer is installed
  stat: path=/usr/local/bin/composer
  register: composer_bin

- name: Install Composer with the official installer
  become: yes
  when: not composer_bin.stat.exists
  block:
    - name: Fetch the Composer installer signature
      uri:
        url: https://composer.github.io/installer.sig
        return_content: yes
      register: composer_installer_sig

    - name: Download the Composer installer and verify its signature
      get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
        checksum: "sha384:{{ composer_installer_sig.content | trim }}"
        mode: '0644'

    - name: Run the Composer installer
      command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
      args:
        creates: /usr/local/bin/composer

    - name: Remove the Composer installer
      file: path=/tmp/composer-setup.php state=absent
